user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
# Request paths, authorization headers and upstream errors are not logged.
error_log /dev/stderr crit;
events { worker_connections 512; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 30s;
    limit_req_zone $server_name zone=rpc_budget:1m rate=8r/s;
    limit_conn_zone $server_name zone=rpc_connections:1m;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream rpchub_private {
        zone rpchub_private 64k;
        server rpchub:9563 resolve;
        keepalive 8;
    }
    server {
        listen 8080;
        server_name rpc.luen.casa;
        auth_basic "RPChub";
        auth_basic_user_file /etc/rpchub-auth/users.htpasswd;
        limit_req_status 429;
        limit_conn_status 429;
        limit_conn rpc_connections 8;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header X-Rpchub-Upstream;

        location = /health {
            auth_basic off;
            default_type application/json;
            return 200 '{"status":"gateway","archiveReadiness":"not_checked"}';
        }
        location ~ ^/(56|8453)(/(archive|indexer))?$ {
            limit_except POST { deny all; }
            limit_req zone=rpc_budget burst=16 delay=4;
            proxy_pass http://rpchub_private;
        }
        location ~ ^/(chains|56/health|8453/health|56/indexer/health|8453/indexer/health)$ {
            limit_except GET { deny all; }
            limit_req zone=rpc_budget burst=16 delay=4;
            proxy_pass http://rpchub_private;
        }
        location / { return 404; }
    }
}
